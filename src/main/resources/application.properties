# ===================================================================
# STUDENT GRADE MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# ===================================================================

spring.application.name=student-grade-management-system
server.port=8080

# Profile selection:
# Use 'dev' for instant out-of-the-box execution with seeded sample data (H2 MySQL-compatibility mode)
# Use 'mysql' to connect to local MySQL Server (port 3306, database: student_grade_management)
spring.profiles.active=dev

# Session Configuration (Timeout: 60 minutes)
server.servlet.session.timeout=60m

# Multipart & JSON Configuration
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Logging Configuration
logging.level.root=INFO
logging.level.com.college.grademanagement=INFO
